<!DOCTYPE html>
<html lang="en">
    <head>
        <title>FLEX</title>
        <style>
            .container
            {
                display: flex;
                height: 100vh;
                width: 100vx;
                background-color: antiquewhite;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .item
            {
             background-color:rgb(235, 108, 108);
             border: 1px solid black;
             padding: 20px;

            }
            .item1
            {
              flex: 2;
            }
            .item2
            {
            flex: 1;
            }
            .item3
            {
                flex: 3
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="item item1">Header</div>
            <div class="item item2">Side Menu</div>
            <div class="item item3">Main Menu</div>
            <div class="item item4">Content1</div>
            <div class="item item5">Content2</div>
            <div class="item item6">Footer</div>
        </div>
    </body>
</html>
